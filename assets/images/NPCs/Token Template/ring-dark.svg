<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Dark (unlit) side of every NPC spotlight token (npm run npc-art:generate).
    Anything drawn in #FF00FF is painted black. The head is masked to a circle of radius 45
    (centre 50,50), so the ring should cover the band from radius 45 out to 50.
  -->
  <circle cx="50" cy="50" r="47.5" fill="none" stroke="#FF00FF" stroke-width="5"/>
  <circle cx="50" cy="50" r="49.6" fill="none" stroke="#3a3a44" stroke-width="0.8"/>
  <circle cx="50" cy="50" r="45.2" fill="none" stroke="#3a3a44" stroke-width="0.6"/>
</svg>
